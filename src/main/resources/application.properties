spring.application.name=tracker

# Everything environment-specific is overridable with an environment variable; the value after ":" is the local default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitness_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
# A database built by the old ddl-auto=update is adopted at V1 without re-running it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=${SHOW_SQL:false}
# Loads workout exercises/sets in batches instead of one query per workout.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Exercise demo photos (free-exercise-db, public domain), pinned to one commit and served by jsDelivr.
app.exercise-images.base-url=https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@a859101d633a01c4a1a920d6a8ce41dabba0705f/exercises/


# Most hosts assign the port through $PORT.
server.port=${PORT:8080}
# Trust X-Forwarded-* from the HTTPS reverse proxy (Caddy) in front of the app.
server.forward-headers-strategy=framework

# Session-based auth: JSESSIONID cookie carries the login, no token needed.
# In production over HTTPS set SESSION_COOKIE_SECURE=true.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# Where the React site lives: allowed CORS origins (comma-separated) and the base of emailed links.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Google sign-in: the OAuth 2.0 Web client ID from Google Cloud Console. Empty hides the Google button.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# FitTracker Ultimate, paid with Tanzanian mobile money through ClickPesa (clickpesa.com).
# Leave the credentials empty to hide payments. Prices are whole Tanzanian shillings.
app.billing.clickpesa.base-url=${CLICKPESA_BASE_URL:https://api.clickpesa.com/third-parties}
app.billing.clickpesa.client-id=${CLICKPESA_CLIENT_ID:}
app.billing.clickpesa.api-key=${CLICKPESA_API_KEY:}
app.billing.clickpesa.checksum-key=${CLICKPESA_CHECKSUM_KEY:}
app.billing.monthly-price-tzs=${ULTIMATE_MONTHLY_TZS:10000}
app.billing.yearly-price-tzs=${ULTIMATE_YEARLY_TZS:100000}
# Preview mode shows the Ultimate payment screen even when ClickPesa keys are absent, so the UI can be
# tried before launch. Local Spring Boot defaults to on; the production compose file sets it to false.
app.billing.preview-mode=${BILLING_PREVIEW_MODE:true}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:joglows97@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true