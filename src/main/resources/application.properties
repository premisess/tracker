spring.application.name=tracker

# Everything environment-specific is overridable with an environment variable; the value after ":" is the local default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitness_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
# A database built by the old ddl-auto=update is adopted at V1 without re-running it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=${SHOW_SQL:false}
# Loads workout exercises/sets in batches instead of one query per workout.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Exercise demo photos (free-exercise-db, public domain), pinned to one commit and served by jsDelivr.
app.exercise-images.base-url=https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@a859101d633a01c4a1a920d6a8ce41dabba0705f/exercises/


# Most hosts assign the port through $PORT.
server.port=${PORT:8080}
# Trust X-Forwarded-* from the HTTPS reverse proxy (Caddy) in front of the app.
server.forward-headers-strategy=framework

# Session-based auth: JSESSIONID cookie carries the login, no token needed.
# In production over HTTPS set SESSION_COOKIE_SECURE=true.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# Where the React site lives: allowed CORS origins (comma-separated) and the base of emailed links.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Google sign-in: the OAuth 2.0 Web client ID from Google Cloud Console. Empty hides the Google button.
app.google.client-id=${GOOGLE_CLIENT_ID:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:fittrackers2026@gmail.com}
# Where replies to FitTracker emails go.
app.contact-email=${CONTACT_EMAIL:fittrackers2026@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Give up quickly instead of hanging a request when SMTP is unreachable (some hosts block it).
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Hosts that block SMTP (Render's free plan): set BREVO_API_KEY and emails go through Brevo's HTTPS API
# instead, still sent as MAIL_USERNAME (verify that address as a sender in Brevo first).
app.mail.brevo-api-key=${BREVO_API_KEY:}
# Or, with no extra account: a Google Apps Script web app on the Gmail account sends it (see
# deploy/gmail-sender.gs). MAIL_SCRIPT_SECRET must match the SECRET in that script.
app.mail.script-url=${MAIL_SCRIPT_URL:}
app.mail.script-secret=${MAIL_SCRIPT_SECRET:}

# Logins are stored in the database (Flyway creates the tables), so they survive restarts.
spring.session.jdbc.initialize-schema=never