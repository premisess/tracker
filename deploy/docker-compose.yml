# One-server deployment: MySQL + the Spring Boot API + Caddy serving the React site.
#
# The site and the API share one domain (Caddy forwards /api to the backend), so the login
# cookie works without any cross-site settings, and Caddy gets an HTTPS certificate from
# Let's Encrypt automatically. HTTPS is required: browsers only allow GPS on secure pages.
#
#   1. Put this repo and fitness-tracker-ui on the server, side by side.
#   2. Point your domain's DNS at the server and open ports 80 and 443. For a free DuckDNS
#      name, set DUCKDNS_DOMAIN and DUCKDNS_TOKEN in deploy/.env and the duckdns service does it.
#   3. cp deploy/.env.example deploy/.env   and fill it in.
#   4. docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fitness_tracker
      MYSQL_USER: fittracker
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/fitness_tracker
      DB_USERNAME: fittracker
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME:?set MAIL_USERNAME in deploy/.env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in deploy/.env}
      APP_FRONTEND_URL: https://${SITE_ADDRESS}
      APP_CORS_ORIGINS: https://${SITE_ADDRESS}
      SESSION_COOKIE_SECURE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-fittrackers2026@gmail.com}
    volumes:
      # Profile pictures; without a volume they'd vanish on every redeploy.
      - uploads:/app/uploads

  web:
    build:
      context: ${FRONTEND_PATH:?set FRONTEND_PATH in deploy/.env}
      args:
        # Shown on the landing page's About section and the privacy page.
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-fittrackers2026@gmail.com}
        VITE_CONTACT_PHONE: ${CONTACT_PHONE:-+255623413993}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      BACKEND_ADDRESS: backend:8080
    volumes:
      # Caddy's certificates; keep them so it doesn't re-request on every restart.
      - caddy-data:/data
      - caddy-config:/config

  # Keeps a free DuckDNS name (yourname.duckdns.org) pointed at this server, even if its public IP
  # changes. Leaving DUCKDNS_TOKEN empty turns it off. An empty ip= makes DuckDNS use the IP the
  # request comes from, which is this server.
  duckdns:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$DUCKDNS_TOKEN" ] || [ -z "$$DUCKDNS_DOMAIN" ]; then
          echo "DuckDNS is off: set DUCKDNS_DOMAIN and DUCKDNS_TOKEN in deploy/.env to turn it on."
          exec sleep 2147483647
        fi
        while true; do
          echo "$$(date -u) DuckDNS update for $$DUCKDNS_DOMAIN: $$(curl -fsS "https://www.duckdns.org/update?domains=$$DUCKDNS_DOMAIN&token=$$DUCKDNS_TOKEN&ip=" || echo failed)"
          sleep 300
        done

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
